openapi: 3.0.3
info:
  title: Response headers test
  version: "1.0"
paths:
  /items:
    get:
      operationId: listItems
      summary: List items with rate-limit headers
      tags:
        - items
      responses:
        "200":
          description: Successful response
          headers:
            X-Rate-Limit:
              description: Request limit per hour
              schema:
                type: integer
            X-Rate-Limit-Remaining:
              description: Remaining requests in window
              schema:
                type: integer
            X-Rate-Limit-Reset:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /items/{id}:
    get:
      operationId: getItem
      summary: Get a single item (no response headers)
      tags:
        - items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
