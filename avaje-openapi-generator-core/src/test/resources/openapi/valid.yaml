openapi: 3.0.3
info:
  title: Valid Cascade API
  version: 1.0.0
paths:
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
components:
  schemas:
    Order:
      type: object
      required: [customer]
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        labels:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        attachments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Item'
        note:
          type: string
    Customer:
      type: object
      properties:
        name:
          type: string
    Item:
      type: object
      properties:
        sku:
          type: string
    OrderStatus:
      type: string
      enum: [NEW, SHIPPED]
