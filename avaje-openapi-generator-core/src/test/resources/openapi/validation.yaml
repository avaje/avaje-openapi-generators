openapi: 3.0.3
info:
  title: Validation API
  version: 1.0.0
paths:
  /widgets:
    get:
      tags: [widgets]
      operationId: listWidgets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Widget'
components:
  schemas:
    Widget:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}\d+$'
        email:
          type: string
          format: email
        price:
          type: number
          minimum: 0.5
          maximum: 99.99
        ratio:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          exclusiveMaximum: true
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        tags:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
